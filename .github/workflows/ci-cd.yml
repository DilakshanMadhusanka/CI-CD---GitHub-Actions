name: PERN CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION (CI): Test & Build
  # =========================================================================
  ci-test:
    name: Run Automated Tests & Builds
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL database container for integration testing in CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perndb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # --- BACKEND CI ---
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run Backend Tests
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/perndb_test

      # --- FRONTEND CI ---
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Frontend Application
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: /api

      - name: Verify Build Artifacts
        run: |
          test -d client/dist && echo "Frontend build succeeded!"

  # =========================================================================
  # 2. CONTINUOUS DEPLOYMENT (CD): Containerize & Deploy
  # =========================================================================
  cd-deploy:
    name: Build & Deploy Container Images
    runs-on: ubuntu-latest
    needs: [ci-test]
    # Only run on push to main branch (not on pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Server image
      - name: Build and Push Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pern-server:latest
            ghcr.io/${{ github.repository }}/pern-server:${{ github.sha }}

      # Build and push Client image
      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pern-client:latest
            ghcr.io/${{ github.repository }}/pern-client:${{ github.sha }}

      # Trigger Cloud Platform or Webhook Deployment (Optional - e.g. Render / Railway / Webhook)
      - name: Trigger Webhook Deploy (Optional)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment webhook..."
          curl -s -X POST "$DEPLOY_WEBHOOK_URL"

      - name: Deployment Summary
        run: |
          echo "### 🚀 CI/CD Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Images Published:**" >> $GITHUB_STEP_SUMMARY
          echo "  - \`ghcr.io/${{ github.repository }}/pern-server:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`ghcr.io/${{ github.repository }}/pern-client:latest\`" >> $GITHUB_STEP_SUMMARY
