version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pern_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perndb
    ports:
      - '5432:5432'
    volumes:
      - ./server/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d perndb']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pern_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/perndb
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pern_client
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  pgdata:
